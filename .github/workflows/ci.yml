name: Shell CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code into the runner workspace
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Show runner environment details
      - name: Environment Diagnostics
        run: |
          echo "Current working directory: $(pwd)"
          echo "Running as user: $(whoami)"
          echo "Installed bash version: $(bash --version | head -n 1)"

      # Step 3: Syntax check (Linting)
      - name: Syntax check Bash scripts
        run: |
          echo "Checking syntax of all .sh scripts..."
          bash -n scripts/math.sh
          bash -n tests/test_math.sh
          echo "Syntax check passed!"

      # Step 4: Run test suite
      - name: Execute automated tests
        run: |
          chmod +x scripts/*.sh tests/*.sh
          ./tests/test_math.sh
