name: 04 - Multi-Job Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  # Job 1: Check code formatting and syntax
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          echo "Checking syntax of shell scripts..."
          bash -n scripts/*.sh tests/*.sh
          echo "Linting complete: Code formatting and syntax is valid!"

  # Job 2: Run automated test suite
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          chmod +x scripts/*.sh tests/*.sh
          ./tests/run_tests.sh
          echo "All unit tests passed!"

  # Job 3: Deploy to production (ONLY runs if BOTH lint and test succeed!)
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test] # <--- Key feature: wait for both lint and test!

    steps:
      - name: Deploy application
        run: |
          echo "🚀 Starting simulated deployment..."
          echo "Both lint and test succeeded! Deploying safely to production."
          echo "Deployment finished at $(date)!"
