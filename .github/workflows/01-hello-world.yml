name: 01 - Hello World

# When should this workflow run?
on:
  push:                # Runs automatically every time you push code
  workflow_dispatch:   # Gives you a "Run workflow" button in the GitHub web UI

# What should it do?
jobs:
  say-hello:
    runs-on: ubuntu-latest    # Spin up a fresh Ubuntu Linux virtual machine

    steps:
      - name: Print Hello World
        run: echo "Hello, World! Welcome to GitHub Actions!"

      - name: Who is running this?
        run: echo "I am running as user $(whoami) on host $(hostname)"
