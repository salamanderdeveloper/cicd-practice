name: 06 - Using Secrets

on:
  push:
    paths:
      - '.github/workflows/06-secrets.yml'
  workflow_dispatch:

jobs:
  secret-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Attempt to read and print the secret
        env:
          DB_PASS: ${{ secrets.MY_DATABASE_PASSWORD }}
        run: |
          echo "=== 1. What happens when you try to print a secret directly? ==="
          echo "Database password is: $DB_PASS"

          echo "=== 2. Can the script actually use the secret? ==="
          if [ -n "$DB_PASS" ]; then
            echo "✅ SUCCESS: The secret exists and was delivered securely to the runner!"
            echo "Length of the password is: ${#DB_PASS} characters"
          else
            echo "❌ ERROR: Secret is empty!"
            exit 1
          fi
